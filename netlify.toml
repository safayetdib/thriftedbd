# Netlify deploy config for thriftedBD (Next.js 16, full-stack: SSR + Server
# Actions + Route Handlers + middleware). Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# The Next.js runtime (opennextjs-netlify, npm: @netlify/plugin-nextjs) turns
# the `next build` output into Netlify Functions (SSR/ISR), an Edge Function
# (middleware), and Image CDN wiring. Netlify's docs say this is auto-installed
# whenever a Next.js package.json is detected, but that auto-install does NOT
# fire when a custom [build].command is set (confirmed: without this
# [[plugins]] block, the build log only loads @netlify/plugin-lighthouse, 0
# functions get generated, and every route 404s because the raw .next folder
# gets uploaded as if it were a static site). Declaring the plugin explicitly
# here + as a devDependency in package.json makes it run reliably.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  # Must be Next's build output dir (.next), never the base/repo root — the
  # plugin's onBuild step hard-fails if publish == base ("Your publish
  # directory cannot be the same as the base directory of your site"). It
  # reads .next itself and repackages it into Functions/Edge Functions/static
  # assets; this value is never served directly, it just can't be the repo
  # root. NOTE: known plugin bug — the Netlify UI's "Publish directory" site
  # setting can win over this value. If deploys still fail with that error
  # after this change, go to Site settings > Build & deploy > Build settings
  # and set (or clear) Publish directory to ".next" there too.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  HUSKY = "0" # skip git-hook install during CI build
  # Auth.js v5 infers the request host automatically on Vercel/Cloudflare
  # Pages, but Netlify isn't in that auto-detect list — requests pass through
  # Netlify's proxy layer, so this must be set explicitly or sign-in breaks.
  AUTH_TRUST_HOST = "true"

# Secrets (MONGODB_URI, AUTH_SECRET, R2_*, GOOGLE_TRANSLATE_API_KEY) are set in
# the Netlify UI: Site settings -> Environment variables. Do not commit them.
